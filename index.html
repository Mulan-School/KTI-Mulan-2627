<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informasi Guru Pembimbing — SMP Muhammadiyah 9 Jakarta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#032249;
    --navy:#043263;
    --navy-soft:#0c4a86;
    --sky:#00b6f0;
    --orange:#fa9632;
    --ice:#eef6fc;
    --white:#ffffff;
    --ink:#0f2038;
    --muted:#5c7291;
    --line:#dbe7f3;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow:0 22px 48px -20px rgba(4,50,99,.38);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #f4faff 0%, #ffffff 55%);
  }

  a{color:inherit;}

  /* ---------- HEADER ---------- */
  header.site-header{
    position:relative;
    overflow:hidden;
    background:linear-gradient(125deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-soft) 100%);
    padding:34px 20px 74px;
    text-align:center;
    color:var(--white);
  }
  header.site-header::before{
    content:"";
    position:absolute; left:-110px; bottom:-190px;
    width:320px;height:320px;border-radius:50%;
    border:24px solid rgba(250,150,50,.16);
  }
  header.site-header::after{
    content:"";
    position:absolute; right:-130px; top:-170px;
    width:340px;height:340px;border-radius:50%;
    border:26px solid rgba(0,182,240,.20);
  }
  .logo-img{
    height:56px;
    width:auto;
    display:inline-block;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.25));
    position:relative;
    z-index:1;
  }
  h1.title{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:clamp(22px, 5vw, 30px);
    margin:20px 0 8px;
    position:relative;
    z-index:1;
    letter-spacing:.01em;
  }
  p.subtitle{
    margin:0;
    font-size:15px;
    color:rgba(255,255,255,.82);
    position:relative;
    z-index:1;
    max-width:420px;
    margin-inline:auto;
    line-height:1.5;
  }

  /* ---------- MAIN ---------- */
  main{
    flex:1;
    display:flex;
    justify-content:center;
    padding:0 18px 56px;
    margin-top:-42px;
  }
  .panel{width:100%; max-width:540px; position:relative; z-index:2;}

  .card{
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:28px 24px 26px;
  }
  .card h2{
    font-family:'Poppins', sans-serif;
    font-size:19px;
    margin:0 0 6px;
  }
  .card p.hint{
    margin:0 0 20px;
    color:var(--muted);
    font-size:14px;
    line-height:1.55;
  }

  .search-row{
    display:flex;
    gap:10px;
  }
  input[type="text"]{
    flex:1;
    min-width:0;
    padding:14px 16px;
    font-size:16px;
    font-family:inherit;
    border-radius:var(--radius-md);
    border:2px solid var(--line);
    background:var(--ice);
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  input[type="text"]::placeholder{color:#93a8c2;}
  input[type="text"]:focus{
    outline:none;
    border-color:var(--sky);
    background:var(--white);
    box-shadow:0 0 0 4px rgba(0,182,240,.18);
  }

  button.btn{
    border:none;
    cursor:pointer;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--white);
    background:var(--navy);
    padding:0 22px;
    border-radius:var(--radius-md);
    transition:background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  button.btn:hover{background:var(--navy-deep);}
  button.btn:active{transform:scale(.97);}
  button.btn:focus-visible{outline:3px solid var(--orange); outline-offset:2px;}

  .keyhint{
    margin:10px 2px 0;
    font-size:12.5px;
    color:var(--muted);
  }
  .keyhint kbd{
    font-family:inherit;
    font-size:11.5px;
    background:var(--ice);
    border:1px solid var(--line);
    border-bottom-width:2px;
    padding:1px 6px;
    border-radius:6px;
    color:var(--navy);
  }

  #resultArea{margin-top:6px;}

  /* ---------- ID CARD RESULT ---------- */
  .id-card{
    margin-top:22px;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 16px 34px -18px rgba(4,50,99,.4);
    opacity:0;
    transform:translateY(14px);
    animation:reveal .45s ease forwards;
  }
  @keyframes reveal{ to{opacity:1; transform:translateY(0);} }

  .id-card__top{
    background:linear-gradient(120deg, var(--navy) 0%, var(--sky) 130%);
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .id-card__avatar{
    flex:0 0 auto;
    width:50px; height:50px;
    border-radius:50%;
    background:var(--white);
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:.02em;
  }
  .id-card__who{min-width:0;}
  .id-card__name{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--white);
    line-height:1.3;
    overflow-wrap:anywhere;
  }
  .id-card__kelas-pill{
    display:inline-block;
    margin-top:4px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--navy-deep);
    background:rgba(255,255,255,.88);
    padding:2px 10px;
    border-radius:999px;
  }
  .id-card__body{
    background:var(--white);
    padding:18px 20px 20px;
    display:grid;
    gap:14px;
  }
  .id-card__row{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .id-card__icon{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:10px;
    background:var(--ice);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .id-card__icon svg{width:18px; height:18px; stroke:var(--navy);}
  .id-card__label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--muted);
    font-weight:600;
    margin:0 0 2px;
  }
  .id-card__value{
    font-size:15.5px;
    font-weight:700;
    color:var(--ink);
    line-height:1.4;
  }

  /* ---------- SUGGESTIONS / NOT FOUND ---------- */
  .msg-box{
    margin-top:22px;
    padding:16px 18px;
    border-radius:var(--radius-md);
    background:var(--ice);
    border:1px solid var(--line);
  }
  .msg-box p{margin:0 0 4px; font-size:14px; color:var(--ink);}
  .msg-box p.small{font-size:12.5px; color:var(--muted); margin:0;}
  .sugg-list{
    list-style:none;
    margin:12px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .sugg-list button{
    width:100%;
    text-align:left;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--white);
    cursor:pointer;
    font-family:inherit;
    font-size:14.5px;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .sugg-list button:hover{border-color:var(--sky); background:#f4fbff;}
  .sugg-list button:focus-visible{outline:3px solid var(--orange); outline-offset:1px;}
  .sugg-list button strong{display:block; font-weight:700;}
  .sugg-list button span{font-size:12.5px; color:var(--muted);}

  .notfound-icon{
    width:30px;height:30px;border-radius:9px;
    background:#fff1e2; display:flex; align-items:center; justify-content:center;
    margin-bottom:8px;
  }
  .notfound-icon svg{width:16px;height:16px;stroke:var(--orange);}

  p.footnote{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    margin:20px 6px 0;
    line-height:1.6;
  }

  /* ---------- FOOTER ---------- */
  footer.site-footer{
    text-align:center;
    padding:18px 16px 26px;
    font-size:12.5px;
    color:var(--muted);
  }

  @media (max-width:380px){
    .search-row{flex-direction:column;}
    button.btn{padding:13px 22px;}
    .card{padding:22px 18px 20px;}
  }

  @media (prefers-reduced-motion: reduce){
    .id-card{animation:none; opacity:1; transform:none;}
  }
</style>
</head>

  const input = document.getElementById('nameInput');
  const searchBtn = document.getElementById('searchBtn');
  const resultArea = document.getElementById('resultArea');

  function normalize(str){
    return str.toLowerCase().trim().replace(/\s+/g, ' ');
  }

  function initials(name){
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return '?';
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  const iconPerson = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"></path></svg>';
  const iconClass = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3 8.5 12 13l9-4.5L12 4Z"></path><path d="M6.5 10.7V16c0 1.4 2.5 3 5.5 3s5.5-1.6 5.5-3v-5.3"></path></svg>';
  const iconWarn = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>';

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderResult(student){
    resultArea.innerHTML = `
      <div class="id-card">
        <div class="id-card__top">
          <div class="id-card__avatar">${escapeHtml(initials(student.nama))}</div>
          <div class="id-card__who">
            <div class="id-card__name">${escapeHtml(student.nama)}</div>
            <span class="id-card__kelas-pill">Kelas ${escapeHtml(student.kelas)}</span>
          </div>
        </div>
        <div class="id-card__body">
          <div class="id-card__row">
            <div class="id-card__icon">${iconPerson}</div>
            <div>
              <p class="id-card__label">Guru Pembimbing</p>
              <p class="id-card__value">${escapeHtml(student.pembimbing)}</p>
            </div>
          </div>
          <div class="id-card__row">
            <div class="id-card__icon">${iconClass}</div>
            <div>
              <p class="id-card__label">Kelas</p>
              <p class="id-card__value">${escapeHtml(student.kelas)}</p>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderSuggestions(list, query){
    const items = list.slice(0, 8).map(s => `
      <li>
        <button type="button" data-name="${escapeHtml(s.nama)}">
          <strong>${escapeHtml(s.nama)}</strong>
          <span>Kelas ${escapeHtml(s.kelas)}</span>
        </button>
      </li>
    `).join('');

    resultArea.innerHTML = `
      <div class="msg-box">
        <p>Ada ${list.length} nama yang cocok dengan "<strong>${escapeHtml(query)}</strong>". Pilih namamu:</p>
        <ul class="sugg-list">${items}</ul>
      </div>
    `;

    resultArea.querySelectorAll('.sugg-list button').forEach(btn => {
      btn.addEventListener('click', () => {
        const chosen = STUDENTS.find(s => s.nama === btn.dataset.name);
        if(chosen){
          input.value = chosen.nama;
          renderResult(chosen);
        }
      });
    });
  }

  function renderNotFound(query){
    resultArea.innerHTML = `
      <div class="msg-box">
        <div class="notfound-icon">${iconWarn}</div>
        <p>Nama "<strong>${escapeHtml(query)}</strong>" tidak ditemukan.</p>
        <p class="small">Periksa kembali ejaan namamu, atau hubungi wali kelas / admin sekolah.</p>
      </div>
    `;
  }

  function doSearch(){
    const raw = input.value;
    const q = normalize(raw);

    if(!q){
      resultArea.innerHTML = `
        <div class="msg-box">
          <p class="small">Ketik nama lengkapmu terlebih dahulu ya.</p>
        </div>
      `;
      return;
    }

    const exact = STUDENTS.find(s => normalize(s.nama) === q);
    if(exact){ renderResult(exact); return; }

    const contains = STUDENTS.filter(s => normalize(s.nama).includes(q));
    if(contains.length === 1){ renderResult(contains[0]); return; }
    if(contains.length > 1){ renderSuggestions(contains, raw); return; }

    renderNotFound(raw);
  }

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      doSearch();
    }
  });
  searchBtn.addEventListener('click', doSearch);
</script>
